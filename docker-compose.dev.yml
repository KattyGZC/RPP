version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: rpp_postgres_dev
    environment:
      POSTGRES_DB: rpp_db_dev
      POSTGRES_USER: rpp_user
      POSTGRES_PASSWORD: rpp_password_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpp_user -d rpp_db_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rpp_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rpp_backend_dev
    env_file: .env.dev
    volumes:
      - ./backend:/app
      - whisper_models_dev:/root/.cache/whisper
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    stdin_open: true
    tty: true

  frontend:
    image: node:20-alpine
    container_name: rpp_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  whisper_models_dev:
